# Frontend image only (nginx + Vite build). Handy when API is already running elsewhere.
# From this folder:
#   docker compose -f compose.yaml up --build
#
# Set VITE_* via environment or a `.env` file in this directory for compose variable substitution.

name: timesheet-frontend

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5001}
        VITE_APP_ORIGIN: ${VITE_APP_ORIGIN:-http://localhost}
        VITE_AUTH_MODE: ${VITE_AUTH_MODE:-microsoft}
        VITE_MS_CLIENT_ID: ${VITE_MS_CLIENT_ID:-1ba6917a-f4c0-49ef-a189-7c57ffd79b50}
        VITE_MS_TENANT_ID: ${VITE_MS_TENANT_ID:-common}
        VITE_MS_REDIRECT_URI: ${VITE_MS_REDIRECT_URI:-http://localhost}
    container_name: timesheet-frontend-web
    restart: unless-stopped
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"
